name: Release

on:
  push:
    branches: [main]
    paths: [package.json]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    if: github.repository == 'jong-kyung/vp-config'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Check for an unpublished version change
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          bash .github/scripts/release-version.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          previous=''
          # Compare the whole push, since HEAD^ may already contain the version bump.
          if [ -n "$BEFORE" ] && [ "$BEFORE" != '0000000000000000000000000000000000000000' ] \
            && git fetch --no-tags --depth=1 origin "$BEFORE"; then
            previous="$(git show "$BEFORE:package.json" | node -pe 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')"
          fi
          if [ "$version" = "$previous" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$previous" ]; then
            echo '::warning::Previous version unavailable; relying on the npm registry check.'
          fi

          # Run npm outside the checkout's pnpm-only devEngines policy.
          cd "$RUNNER_TEMP"
          changed=false
          for package in oxlint-plugin vp-config; do
            if published="$(npm view "@jong-kyung/$package@$version" version 2>"$RUNNER_TEMP/npm-view.err")"; then
              :
            elif grep -q 'E404' "$RUNNER_TEMP/npm-view.err"; then
              published=''
            else
              cat "$RUNNER_TEMP/npm-view.err" >&2
              exit 1
            fi
            if [ -z "$published" ]; then changed=true; fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  ci:
    needs: check
    if: needs.check.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and verify tarballs
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run build
      # pnpm resolves catalog: and workspace: references in the packed manifests.
      - run: vp pm pack --out "$RUNNER_TEMP/oxlint-plugin.tgz"
        working-directory: packages/oxlint-plugin
      - run: vp pm pack --out "$RUNNER_TEMP/vp-config.tgz"
        working-directory: packages/vp-config
      - run: bash .github/scripts/smoke-package.sh "$RUNNER_TEMP/oxlint-plugin.tgz" "$RUNNER_TEMP/vp-config.tgz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: |
            ${{ runner.temp }}/oxlint-plugin.tgz
            ${{ runner.temp }}/vp-config.tgz
          if-no-files-found: error

  publish:
    name: Publish
    needs: [check, ci, build]
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    # Serialize the tag check and publish, including runs approved out of order.
    concurrency:
      group: publish-vp-config
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.13.0
        working-directory: ${{ runner.temp }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Publish verified tarballs with npm trusted publishing
        run: |
          set -euo pipefail
          echo "tag=$(bash .github/scripts/release-version.sh "$VERSION")" >> "$GITHUB_ENV"
          bash .github/scripts/publish-packages.sh "$VERSION" "$RUNNER_TEMP/package"
      - name: Create GitHub Release
        run: |
          set -euo pipefail
          flags=(--title "v$VERSION" --generate-notes --target "$GITHUB_SHA")
          if [ "$tag" = next ]; then flags+=(--prerelease); fi
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" "${flags[@]}"
          fi

  smoke:
    name: Verify registry packages
    needs: [check, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Install and verify the published packages
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if bash .github/scripts/smoke-package.sh "@jong-kyung/oxlint-plugin@$VERSION" "@jong-kyung/vp-config@$VERSION"; then
              exit 0
            fi
            echo "Attempt $attempt failed; waiting for registry propagation."
            sleep 20
          done
          echo '::error::Published packages failed their consumer checks.'
          exit 1
